<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Table</title>
</head>
<body>

    <h2>Employee Details</h2>

    <table border="1px">
        <thead>
            <tr>
                <th>ID</th>
                <th>Employee Name</th>
                <th>Designation</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Prabhat Kumar</td>
                <td>Software Engineer</td>
                <td>IT</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Tony Stark</td>
                <td>Project Manager</td>
                <td>Operations</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Captain Americs</td>
                <td>Data Analyst</td>
                <td>Data Science</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Hulk</td>
                <td>HR Manager</td>
                <td>Human Resources</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Bruce Wayne</td>
                <td>Marketing Specialist</td>
                <td>Marketing</td>
            </tr>
            <tr>
                <td>6</td>
                <td>Wonder Women</td>
                <td>Finance Executive</td>
                <td>Finance</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
