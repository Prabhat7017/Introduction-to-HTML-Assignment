<!-- Qus.1 -> What is HTML, and how is an HTML document structured?
Sol -> HTML (HyperText Markup Language) is the standard language used to create and design web   pages. It structures web content using elements and tags to define headings, paragraphs, links, images, tables, forms, and more. HTML works alongside CSS (for styling) and JavaScript (for interactivity) to create dynamic web experiences.

Structure of an HTML Document: -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2 style="color: aqua">My Name is Prabhat Kumar</h2>
  </body>
</html>

<!-- <!DOCTYPE html> – Declares the document type and version of HTML (HTML5 in this case).
<html lang="en"> – The root element that wraps all content.
<head> – Contains metadata, the title, character encoding, and links to stylesheets or scripts.
<title> – Specifies the webpage title shown in the browser tab.
<body> – Contains the visible content of the webpage. -->
